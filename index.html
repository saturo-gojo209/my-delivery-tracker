<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My delivery tracker</title>
    <style>

body {

font-family: Arial, sans-serif;

background: aliceblue;

text-align: center;

padding: 30px;

}

h1 { color: #ff5a43; }

button {

background: #ff5a43;

color: white;

padding: 10px 25px;

border: none;

border-radius: 20px;

cursor: pointer;

margin: 5px;

}

div {

border: 1px solid #ff5a43;

width: 280px;

margin: 6px auto;

padding: 8px 12px;

text-align: left;

border-radius: 6px;

}

</style>
</head>
<body>
    <h1>My Delivery Tracker</h1>

<button onclick="saveOrder()">Save Order</button>

<button onclick="startDelivery()">Start Delivery</button>

<div>JSON Text: <span id="json-text"></span></div>

<div>Loaded Item: <span id="loaded-item"></span></div>

<div>Loaded Price: <span id="loaded-price"></span></div>

<div>Status: <span id="status"></span></div>

<div>Result: <span id="result"></span></div>

<script>
    let Order={
        item:"Nuke",
        price:5000000000,
        shop:"Kims arsenal"
    } 

    function saveOrder(){
        let jsontext=JSON.stringify(Order)
        let neworder = JSON.parse(jsontext)

        document.getElementById("json-text").innerHTML=jsontext
        document.getElementById("loaded-item").innerHTML=neworder.item
        document.getElementById("loaded-price").innerHTML=neworder.price


    }
    function delay(ms){
        return new Promise(function (resolve){
            setTimeout(resolve,ms)
        })
    }
    async function startDelivery() {
        document.getElementById("result").innerHTML=""
        document.getElementById("status").innerHTML="order received"
        setTimeout(function (){
            document.getElementById("status").innerHTML="kitchen is preparing"
        },1000)

        await delay(3000)
            document.getElementById("status").innerHTML="Out for delivery"
        

        await delay(2000)
        document.getElementById("result").innerHTML="your order has arrived"
    }
</script>
</body>
</html>
